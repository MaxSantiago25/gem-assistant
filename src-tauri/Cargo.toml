[package]
name = "island-agent"
version = "0.1.0"
description = "Island Agent - Agente inteligente con interfaz tipo isla dinámica"
authors = ["Island Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

